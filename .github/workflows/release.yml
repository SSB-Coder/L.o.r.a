name: Release

# Nightly prereleases come from master and stable releases from release/X.Y branches. See docs/releases.md.
# Pull requests build and verify every binary but publish nothing.

on:
  push:
    branches: [master, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Let every push to a release branch finish so no patch release is skipped.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine version and channel
        id: version
        run: |
          manifest="$(jq -r .version package.json)"
          case "$GITHUB_REF" in
            refs/heads/release/*)
              line="${GITHUB_REF#refs/heads/release/}"
              case "$line" in
                *.*.*) echo "Name release branches release/<major>.<minor>, not release/$line." >&2; exit 1 ;;
              esac
              case "$manifest" in
                "$line".*) ;;
                *) echo "package.json version $manifest does not belong to release/$line." >&2; exit 1 ;;
              esac
              channel=stable
              version="$manifest"
              ;;
            refs/heads/master)
              channel=nightly
              version="$manifest-nightly.$GITHUB_RUN_NUMBER"
              ;;
            *)
              channel=none
              version="$manifest-dev.$GITHUB_RUN_NUMBER"
              ;;
          esac
          echo "Building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LORA_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each target builds on its own OS, so macOS binaries are signed and every binary is run before release.
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: windows-x64, os: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts ${{ matrix.target }}
      - name: Verify the binary runs and reports its version
        shell: bash
        run: |
          dir="dist/lora-$LORA_VERSION-${{ matrix.target }}"
          exe="$dir/lora"; [ -f "$exe.exe" ] && exe="$exe.exe"
          test "$(cat "$dir/VERSION")" = "$LORA_VERSION"
          test "$("$exe" --version)" = "lora v$LORA_VERSION"
          # Start it for real against an empty home and check the UI and API answer.
          export LORA_HOME="$RUNNER_TEMP/lora-home"
          mkdir -p "$LORA_HOME" && printf 'server:\n  port: 18765\n' > "$LORA_HOME/lora.yaml"
          "$exe" --no-open & pid=$!
          for _ in $(seq 30); do curl -sf http://127.0.0.1:18765/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18765/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'host: 127.0.0.1:18765' http://127.0.0.1:18765/api/state)" = 401
          kill "$pid"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lora-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lora-*
          path: dist
          merge-multiple: true
      - name: Add checksums
        working-directory: dist
        run: |
          sha256sum lora-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released. Bump the patch version in package.json to publish a fix."
            exit 0
          fi
          prerelease=""
          [ "$CHANNEL" = nightly ] && prerelease="--prerelease"
          notes="Install: \`curl -fsSL https://raw.githubusercontent.com/$GH_REPO/master/scripts/install.sh | sh\` (macOS/Linux) or \`irm https://raw.githubusercontent.com/$GH_REPO/master/scripts/install.ps1 | iex\` (Windows). Or download the archive for your platform, check it against SHA256SUMS, and run \`lora\`. LORA needs Ollama running locally."
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "LORA $VERSION" \
            --notes "$notes" --generate-notes $prerelease
