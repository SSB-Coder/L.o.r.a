[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lora"
version = "0.1.0"
description = "L.O.R.A - Layer Oriented Research Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LORA Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.14.1",
    "torchvision>=0.18.0; sys_platform == 'linux'",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "trafilatura>=2.3.1",
    "playwright>=1.63.0",
    "beautifulsoup4>=4.15.0",
    "truststore>=0.10.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.12.1",
    "kokoro-onnx>=0.5.0",
    "scipy>=1.17.1",
    "faster-whisper>=1.2.1",
    # faster-whisper 1.2.1 passes av.open(metadata_errors=...), removed in newer PyAV.
    "av>=16.1.0,<17; sys_platform == 'linux'",
    "onnxruntime>=1.30.0",
    "pynput>=1.8.2",
    "qrcode>=8.2",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
    "pyside6>=6.8.0",
    "cactus-compute==4.2.3",
    "jsonschema>=4.23",
]

[project.scripts]
lora = "lora.main:main"

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8.0"]
neural-routing = ["laya>=0.4.7"]
wakeword = ["openwakeword>=0.6.0"]
experimental = ["laya>=0.4.7", "torchvision>=0.18.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

# Lora's embeddings and voice run on CPU; Ollama owns GPU language inference.
# Windows retains its existing default PyPI resolution.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
