<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <meta content="#f5f5f0" name="theme-color"/>
  <meta content="light dark" name="color-scheme"/>
  <meta content="yes" name="apple-mobile-web-app-capable"/>
  <title>
   L.O.R.A Mobile · Companion
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="app-container">
   <header id="header">
    <div class="topline">
     <a aria-label="LORA home" class="wordmark" href="#">lora<span>.</span></a>
     <span class="device-label">DESKTOP COMPANION</span>
    </div>
    <div class="presence">
     <div id="orb-container">
      <canvas aria-hidden="true" height="240" id="hydro-orb-canvas" width="240">
      </canvas>
     </div>
     <div id="status-bar">
      <div id="status-indicator" role="status">
       <span class="status-dot"></span>
       <span id="status-text">Connecting…</span>
      </div>
      <div class="hidden" id="queue-banner">
       In queue ·
       <span id="queue-pos">1</span>
      </div>
     </div>
    </div>
   </header>
   <div id="controls-bar">
    <details class="style-menu">
     <summary>Answer style <span id="depth-label">Standard</span><span aria-hidden="true">⌄</span></summary>
     <div aria-label="Answer detail" class="depth-selector" role="group">
      <button aria-pressed="false" class="depth-chip" data-depth="eli5" type="button">ELI5 <small>A gentle introduction</small></button>
      <button aria-pressed="false" class="depth-chip" data-depth="simple" type="button">Simple <small>Just the essentials</small></button>
      <button aria-pressed="true" class="depth-chip active" data-depth="standard" type="button">Standard <small>A balanced explanation</small></button>
      <button aria-pressed="false" class="depth-chip" data-depth="detailed" type="button">Detailed <small>A closer look</small></button>
      <button aria-pressed="false" class="depth-chip" data-depth="expert" type="button">Expert <small>More technical depth</small></button>
     </div>
    </details>
    <div class="utility-actions">
     <button aria-label="Saved notebooks" class="icon-btn" id="nb-toggle" title="Saved notebooks" type="button"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="M5 4h14v16H5zM8 4v16M11 8h5M11 12h4"></path></svg></button>
     <button aria-label="Browser readout" aria-pressed="true" class="icon-btn active" id="tts-toggle" title="Browser readout" type="button"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 8c2 2 2 6 0 8M20 5c4 4 4 10 0 14"></path></svg></button>
    </div>
   </div>
   <main aria-label="Conversation" aria-live="polite" id="chat-feed" role="log">
    <div class="welcome" id="welcome">
     <span class="eyebrow">A MOMENT TO THINK</span>
     <h1>What’s on<br/>your mind?</h1>
     <p>Ask a question, follow a thought,<br/>or pick up your research.</p>
    </div>
   </main>
   <div class="hidden" id="floating-stop-container">
    <button class="stop-btn" id="floating-stop-btn" type="button"><span aria-hidden="true">■</span> Stop response</button>
   </div>
   <footer id="input-footer">
    <form id="ask-form">
     <label class="sr-only" for="query-input">
      Message LORA
     </label>
     <textarea autocomplete="off" id="query-input" maxlength="8000" placeholder="Message LORA…" required="" rows="1"></textarea>
     <button aria-label="Send message" id="submit-btn" type="submit"><svg aria-hidden="true" height="22" viewbox="0 0 24 24" width="22"><path d="M12 19V5m-6 6 6-6 6 6"></path></svg></button>
    </form>
    <p class="footer-note">A conversation with your desktop.</p>
   </footer>
  </div>
  <div aria-labelledby="citation-title" aria-modal="true" class="modal-sheet hidden" id="citation-sheet" role="dialog" tabindex="-1">
   <div class="sheet-scrim" id="sheet-scrim">
   </div>
   <div class="sheet-content">
    <div aria-hidden="true" class="sheet-handle">
    </div>
    <div class="sheet-header">
     <span class="badge" id="citation-badge-label">S1</span>
     <h2 id="citation-title">
      Source
     </h2>
     <button aria-label="Close source" class="close-btn" id="close-sheet-btn" type="button">×</button>
    </div>
    <div class="sheet-body">
     <div class="citation-meta">
      <span class="tier-pill" id="citation-tier"></span>
      <span class="url-text" id="citation-url"></span>
     </div>
     <p class="eyebrow">SOURCE EXCERPT</p>
     <blockquote id="citation-quote">
     </blockquote>
    </div>
   </div>
  </div>
  <script src="orb.js">
  </script>
  <script src="app.js">
  </script>
 </body>
</html>
