<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L.O.R.A</title>
<style>
:root{--bg:#eef2f5;--panel:#ffffff;--line:rgba(15,40,55,.12);--bubble:rgba(15,40,55,.07);--ac:#0e7a9e;--tx:#14262f;--dm:#5f7782;--bad:#c0392b;--ok:#2e9e5b;--ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--stageh:clamp(190px,32vh,300px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1219;--panel:#111b24;--line:rgba(255,255,255,.09);--bubble:rgba(255,255,255,.07);--ac:#6cc4e0;--tx:#e6eef3;--dm:#8a9ba6;--bad:#f0766a;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0a1219;--panel:#111b24;--line:rgba(255,255,255,.09);--bubble:rgba(255,255,255,.07);--ac:#6cc4e0;--tx:#e6eef3;--dm:#8a9ba6;--bad:#f0766a;--ok:#4ade80}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.55 var(--ui);overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}

/* droplet stage: full screen when the chat is empty, a strip under the chat otherwise */
#stage{position:fixed;inset:0}
#orb{display:block;width:100%;height:100%;transition:opacity .9s}
body:not(.empty) #stage{top:auto;bottom:74px;height:var(--stageh)}
body:not(.empty) #stage::after{content:"";position:absolute;left:0;right:0;top:0;height:48px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
#hit{position:fixed;left:50%;top:calc(50% + 8px);width:min(44vmin,400px);height:min(44vmin,400px);transform:translate(-50%,-50%);border:0;border-radius:50%;background:none;z-index:2}
body:not(.empty) #hit{top:auto;bottom:calc(74px + var(--stageh) / 2);transform:translate(-50%,50%);width:min(28vh,190px);height:min(28vh,190px)}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:6}
body:not(.empty) #top{background:var(--bg);border-bottom:1px solid var(--line)}
#left{display:flex;align-items:center;gap:14px;min-width:0}
#wm{font:600 16px var(--ui);letter-spacing:.04em}
#micst{display:flex;align-items:center;gap:7px;color:var(--dm);font-size:12.5px;min-width:0;pointer-events:none}
#micst i{width:7px;height:7px;border-radius:50%;background:var(--dm);flex:none}
#micst.ok i{background:var(--ok)}#micst.bad i{background:var(--bad)}#micst.bad{color:var(--bad)}
#micst span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(40vw,340px)}
#micst.ok span{display:none}
#tools{display:flex;align-items:center;gap:2px}
.tl{background:none;border:0;border-radius:8px;color:var(--dm);font-size:13.5px;padding:7px 11px;transition:color .15s,background .15s}
.tl:hover{color:var(--tx);background:var(--bubble)}
.dd{position:relative}
.menu{position:absolute;right:0;top:42px;width:min(340px,86vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:8}
.menu.small{width:160px;padding:6px}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font-size:14px}
.mi:hover{background:var(--bubble)}
.menu .mh{font-weight:600;margin-bottom:2px}
.menu .mn{color:var(--dm);font-size:12.5px;margin-bottom:10px}
.m-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.m-item .m-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-item .m-del{background:none;border:0;color:var(--dm);padding:2px 7px;font-size:16px;border-radius:6px}
.m-item .m-del:hover{color:var(--bad);background:var(--bubble)}
.m-empty{color:var(--dm);font-size:13px;padding:4px 0 8px}
.m-add-box{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.m-add-box input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px}
.m-btns{display:flex;gap:8px}
.m-btns button{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:none}
.m-btns button:hover{background:var(--bubble)}
.m-btns button.primary{background:var(--ac);border-color:var(--ac);color:var(--bg)}

/* chat */
#chat{position:fixed;top:52px;left:0;right:0;bottom:calc(74px + var(--stageh));overflow-y:auto;padding:6px 0 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;z-index:3}
body.empty #chat{display:none}
.col{width:min(780px,92vw);margin:0 auto}
.msg{margin:16px 0}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--bubble);padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:84%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot .body{overflow-wrap:anywhere;font-size:15.5px;line-height:1.65}
.body p{margin:0 0 .75em}.body p:last-child{margin-bottom:0}
.body h4{margin:1em 0 .35em;font-size:15.5px;font-weight:600}
.body ul,.body ol{margin:.3em 0 .8em;padding-left:1.4em}.body li{margin:.2em 0}
.body code{background:var(--bubble);padding:1px 5px;border-radius:5px;font:13.5px ui-monospace,Consolas,monospace}
.body pre{background:var(--bubble);padding:10px 12px;border-radius:10px;overflow-x:auto;margin:.6em 0}.body pre code{background:none;padding:0}
.body a{color:var(--ac);text-decoration:none}.body a:hover{text-decoration:underline}
.body hr{border:0;border-top:1px solid var(--line);margin:1em 0}
sup.c{color:var(--ac);cursor:pointer;font-size:.68em;padding:0 1px}
.dots{color:var(--dm)}.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
details.src{margin-top:10px;font-size:13px;color:var(--dm)}
details.src summary{cursor:pointer;width:max-content;padding:2px 0}
details.src .s{display:flex;gap:8px;align-items:baseline;padding:3px 0}
details.src .n{color:var(--ac);font-weight:600;min-width:2.2em}
details.src .dom{opacity:.75}
details.src a{color:var(--ac);text-decoration:none}
details.src a:hover{text-decoration:underline}
.chk{margin-top:8px;font-size:13px;color:var(--dm)}
.chk summary{cursor:pointer;width:max-content;padding:2px 0}
.chk .s{padding:2px 0 2px 14px}
.notice{color:var(--dm);font-size:13px;text-align:center;margin:12px 0}

/* idle greeting + hint under the droplet */
#empty{position:fixed;left:0;right:0;bottom:104px;text-align:center;z-index:3;pointer-events:none}
#empty h1{margin:0 0 4px;font:600 22px var(--ui)}
#empty p{margin:0;color:var(--dm)}
body:not(.empty) #empty{display:none}
#hint{position:fixed;left:0;right:0;bottom:80px;text-align:center;color:var(--dm);font-size:13px;min-height:1.2em;z-index:3;pointer-events:none}
body.empty #hint{bottom:78px}

/* input */
#cmd{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(780px,92vw);height:46px;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:0 6px 0 18px;z-index:5;transition:border-color .2s,opacity .2s}
#cmd:focus-within{border-color:var(--ac)}
#cmd.off{opacity:.5}
#cmd input{flex:1;min-width:0;background:none;border:0;padding:8px 0;font-size:15px;caret-color:var(--ac)}
#cmd input:focus-visible{outline:0}
#cmd input::placeholder{color:var(--dm)}
#cmd button.ic{background:none;border:0;color:var(--dm);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
#cmd button.ic:hover{color:var(--tx);background:var(--bubble)}
#cmd button.ic:disabled{opacity:.35;cursor:default}
#mic.active{color:var(--bg)!important;background:var(--ac)!important;animation:pulse-mic 1s infinite alternate}
@keyframes pulse-mic{from{transform:scale(1)}to{transform:scale(1.1)}}
</style>

</head>
<body data-state="idle" class="empty">
<div id="stage"><canvas id="orb"></canvas></div>
<button id="hit" aria-label="Talk to LORA"></button>
<header id="top">
 <div id="left"><div id="wm">LORA</div><div id="micst" title="Checking microphone…"><i></i><span id="mictx"></span></div></div>
 <nav id="tools">
  <div class="dd">
   <button class="tl" id="srcbtn" aria-haspopup="true" aria-expanded="false">Add sources</button>
   <div class="menu" id="srcmenu" hidden>
    <div class="mh">Your sources</div>
    <div class="mn">Files I can read and use when I answer.</div>
    <div id="media-list"></div>
    <div class="m-add-box">
     <input type="text" id="m-path" placeholder="Paste a file path…" aria-label="File path">
     <div class="m-btns"><button type="button" id="m-browse" class="primary">Choose files…</button><button type="button" id="m-add">Add path</button></div>
     <div class="m-btns"><button type="button" id="m-report">Summarize my sources</button></div>
    </div>
   </div>
  </div>
  <div class="dd">
   <button class="tl" id="morebtn" aria-haspopup="true" aria-expanded="false" aria-label="More">⋯</button>
   <div class="menu small" id="moremenu" hidden>
    <button class="mi" id="vo">Voice on</button>
    <button class="mi" id="sl">Sleep</button>
    <button class="mi" id="off">Quit</button>
   </div>
  </div>
 </nav>
</header>
<main id="chat" aria-live="polite"><div class="col" id="msgs"></div></main>
<div id="empty"><h1>Hi, I'm LORA.</h1><p>Type below, hold Space to talk, or say “Hey LORA”.</p></div>
<div id="hint"></div><div id="sub" hidden></div>
<form id="cmd"><input id="q" placeholder="Ask me anything…" autocomplete="off" aria-label="Message"><button type="button" class="ic" id="mic" aria-label="Hold to talk"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button type="submit" class="ic" id="send" aria-label="Send"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
<script>
const $=s=>document.querySelector(s),cv=$('#orb'),gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'});
const dark=()=>{const r=document.documentElement.dataset.theme;return r?r==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform vec2 u_res;
uniform vec3 u_tn;
uniform float u_tm,u_dim;
uniform float u_t,u_tw,u_amp,u_imp,u_think,u_speak,u_f,u_br,u_sq,u_dark,u_bob;
uniform vec2 u_rip[6];
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float deform(float a){
 float d=sin(2.*a+u_tw*.9)+.65*sin(3.*a-u_tw*1.3+1.7)+.42*sin(4.*a+u_tw*1.7+3.1)+.3*sin(5.*a-u_tw*2.2+.6)+.22*sin(6.*a+u_tw*2.7+2.4);
 return d*u_amp*.55;
}
vec3 env(vec3 d){
 float up=d.y*.5+.5;
 vec3 dk=mix(vec3(.01,.05,.08),vec3(.05,.17,.24),up);
 vec3 lt=mix(vec3(.72,.82,.88),vec3(.93,.97,1.),up);
 vec3 c=mix(lt,dk,u_dark);
 c+=pow(max(dot(d,normalize(vec3(-.55,.65,.52))),0.),24.)*mix(1.3,2.4,u_dark);
 c+=vec3(.5,.85,1.)*pow(max(dot(d,normalize(vec3(.85,.25,.45))),0.),30.)*1.2;
 c+=vec3(.3,.7,.9)*pow(max(-d.y,0.),2.)*.4*u_dark;
 return c;
}
vec3 bg(vec2 p){
 float r2=dot(p,p);
 vec3 dk=mix(vec3(.012,.05,.08),vec3(.07,.27,.37),exp(-r2*.45)*.9);
 vec3 lt=mix(vec3(.82,.90,.94),vec3(.97,.99,1.),exp(-r2*.4));
 vec3 c=mix(lt,dk,u_dark);
 float fy=p.y+1.6,fy2=p.y+1.78;
 c+=mix(vec3(-.05,-.03,-.01),vec3(.05,.20,.27),u_dark)*exp(-abs(fy)*5.)*.9;
 c+=mix(vec3(-.12,-.05,0.),vec3(.35,.8,1.),u_dark)*exp(-(p.x*p.x*1.1+fy2*fy2*45.))*.24*(.7+u_imp);
 if(p.y<-.9){
  float de=length(vec2(p.x,fy*6.5));
  for(int i=0;i<6;i++){
   float s=u_rip[i].y;
   if(s>0.){float age=u_rip[i].x;float x=(de-(.3+age*.55))/.04;
    c+=mix(vec3(-.08,-.04,0.),vec3(.45,.85,1.),u_dark)*exp(-x*x)*s*(1.-age/2.8)*.55;}
  }
 }
 return c;
}
void main(){
 vec2 px=gl_FragCoord.xy;
 vec2 c0=u_res*.5+vec2(0.,8.);
 float R=min(u_res.x,u_res.y*1.05)*.24;
 vec2 p=(px-c0)/R;
 float aa=1.5/R;
 vec3 col=bg(p);
 vec3 tc=mix(vec3(.04,.30,.42),vec3(.59,.91,1.),u_dark);
 tc=mix(tc,u_tn*mix(.5,1.,u_dark),u_tm);

 // drifting dust
 vec2 g=p*5.+vec2(0.,u_t*.12);vec2 id=floor(g);vec2 gf=fract(g)-.5;
 float h=hash(id);vec2 off=(vec2(hash(id+3.),hash(id+7.))-.5)*.5;
 float ds=step(.72,h)*(1.-smoothstep(0.,.07,length(gf-off)))*(.5+.5*sin(u_t*.8+h*30.));
 col+=mix(vec3(-.05,-.03,-.01),vec3(.30,.55,.65),u_dark)*ds*.55;

 // orbit rings + spectrum ticks
 float r=length(p);float a=atan(p.y,p.x);
 float rl=1.-smoothstep(0.,aa*1.2,abs(r-1.72));
 col=mix(col,tc,rl*step(.35,fract((a-u_t*.05)/6.28318*60.))*.18);
 float rl2=1.-smoothstep(0.,aa*1.2,abs(r-1.52));
 col=mix(col,tc,rl2*step(fract((a+u_t*.12)/2.0944+.1),.43)*.26);
 float fi=a/6.28318*120.;float idx=floor(fi);float ff=fract(fi)-.5;
 float n1=.5+.5*sin(idx*.7+u_t*(3.+u_f))*sin(idx*.23-u_t*2.1+1.);
 float sp=u_speak*(.12+.88*n1)*(.3+.7*u_imp)+u_think*.08*(.5+.5*sin(a*3.-u_t*2.2))+.02;
 float ew=aa/.065,top=1.27+sp*.3;
 float tm=(1.-smoothstep(.14-ew,.14+ew,abs(ff)))*smoothstep(1.24-aa,1.24,r)*(1.-smoothstep(top,top+aa,r));
 col=mix(col,tc,tm*(.25+sp*.7));

 // droplet geometry
 vec2 pp=p-vec2(0.,u_bob);
 pp.x/=1.-.5*u_sq;pp.y/=1.+u_sq;
 float rd=1.+deform(atan(pp.y,pp.x))+u_br;
 vec2 q=pp/rd;float rq=length(q);
 float gl=exp(-max(rq-1.,0.)*3.2)*(.10+.10*u_speak+.22*u_imp+.05*u_think);
 col+=mix(vec3(-.10,-.05,-.02),mix(vec3(.25,.75,1.),u_tn,u_tm),u_dark)*gl*(1.-.75*u_dim);
 float mask=1.-smoothstep(1.-aa/rd,1.,rq);
 if(mask>0.){
  float z=sqrt(max(1.-rq*rq,0.));
  vec3 n=vec3(q,z);
  vec2 dir=q/max(rq,1e-4);
  float slope=sin(rq*9.-u_t*1.2)*.012*(.4+u_think+.4*u_speak);
  for(int i=0;i<6;i++){
   float s=u_rip[i].y;
   if(s>0.){float age=u_rip[i].x;float dd=(rq-age*.5)/.13;
    slope+=cos((rq-age*.5)*26.)*exp(-dd*dd)*.16*s*(1.-age/2.8);}
  }
  n.xy+=dir*slope+vec2(sin(q.y*6.+u_tw*1.5),cos(q.x*6.-u_tw*1.3))*u_amp*.9;
  n=normalize(n);
  vec3 v=vec3(0.,0.,-1.);
  float cosT=max(n.z,0.);
  vec3 r1=refract(v,n,1./1.325),r2=refract(v,n,1./1.333),r3=refract(v,n,1./1.345);
  vec2 b0=-q*.95;
  vec3 tr=vec3(bg(b0+r1.xy*1.3).r,bg(b0+r2.xy*1.3).g,bg(b0+r3.xy*1.3).b);
  tr+=vec3(.01,.07,.11)*(1.-.5*z)*u_dark;
  vec3 ab=exp(-z*vec3(.65,.2,.1));
  float F=.03+.97*pow(1.-cosT,4.);
  vec3 rv=reflect(v,n);
  vec3 cd=mix(tr*ab,env(rv),clamp(F+.05,0.,1.));
  cd+=vec3(1.)*smoothstep(.915,.935,dot(rv,normalize(vec3(-.5,.62,.6))))*.85;
  cd+=vec3(.7,.95,1.)*smoothstep(.975,.99,dot(rv,normalize(vec3(.5,-.5,.7))))*.45;
  cd+=mix(vec3(-.30,-.18,-.08),vec3(.28,.72,.95),u_dark)*pow(1.-cosT,3.)*.5;
  float ty=(q.y+.62)/.2;
  float cb=exp(-ty*ty)*exp(-q.x*q.x/.3)*(.6+.4*sin(q.x*14.+u_t*1.2));
  float fl=abs(sin(q.x*9.+sin(q.y*7.+u_tw*1.1)*(1.5+u_amp*30.)));
  float fil=pow(1.-fl,14.)*smoothstep(0.,-.5,q.y);
  vec3 cc=mix(vec3(1.),vec3(.6,.95,1.),u_dark);
  cd+=cc*(cb*.55+fil*.35)*z;
  vec2 sg=q*6.+vec2(u_t*.05,u_t*.08);vec2 sid=floor(sg);vec2 sf=fract(sg)-.5;
  float sh=hash(sid+11.);vec2 so=(vec2(hash(sid+1.),hash(sid+5.))-.5)*.5;
  float sk=step(.78,sh)*(1.-smoothstep(0.,.05,length(sf-so)))*(.5+.5*sin(u_t*1.5+sh*40.));
  cd+=cc*sk*.5*z;
  float lm=dot(cd,vec3(.3,.59,.11));cd=mix(cd,lm*u_tn*2.1+cd*.12,u_tm);cd*=1.-.4*u_dim;
  col=mix(col,cd,mask);
 }
 vec2 uv=px/u_res-.5;
 col*=1.-.3*dot(uv,uv)*mix(.4,1.,u_dark);
 col+=(hash(px+fract(u_t))-.5)*.012;
 gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;

// ---------- State ----------
let busy=false,voice=true,streaming=false,lastActivity=Date.now(),pttActive=false;
const $chat=$('#chat'),$msgs=$('#msgs'),$cmd=$('#cmd'),$q=$('#q');
const HINT={
 idle:'',
 listen:'Listening…',
 think:'',
 verify:'',
 speak:'Speaking',
 sleep:'Sleeping · say “Awaken LORA” or tap the droplet',
 off:'Off · tap the droplet to start'
};
const TINT={cyan:[.25,.75,1],amber:[1,.62,.14],sapphire:[.2,.42,1],slate:[.5,.6,.66]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ---------- WebGL orb ----------
let mode='idle',t=0,tw=0,amp=.004,ampT=.004,phase=0,impulse=0,freq=3,rings=[],nextRing=0,th=0,sp=0,sq=0,sv=0,tm=0,tgtTm=0,dim=0,tgtDim=0,tn=[.25,.75,1],tgtTn=tn,last=performance.now();
const rip=new Float32Array(12);
const ripple=(s=1)=>{rings.push({t0:t,s});if(rings.length>6)rings.shift()};

// Calm, stabilized droplet perturbation - prevents violent glitch oscillations
const pulse=(s=0.4)=>{
 impulse=Math.min(1.0,Math.max(impulse,s));
 ripple(s);
 sv=Math.max(-0.03,Math.min(0.03,sv+s*0.04));
};

let U={};
if(!gl){$('#sub').textContent='WebGL is not available in this browser'}else{
 const initProgram=()=>{
 const mk=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s};
 const pr=gl.createProgram();gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
 ['u_res','u_t','u_tw','u_amp','u_imp','u_think','u_speak','u_f','u_br','u_sq','u_dark','u_bob','u_rip','u_tn','u_tm','u_dim'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
 };
 initProgram();
 let renderScale=Math.min(devicePixelRatio||1,1.25),slowT=0,slowN=0,glLost=false;
 // Assigning canvas.width/height clears the drawing buffer (a visible blink), so only resize on a real change.
 const fit=()=>{const w=Math.max(1,Math.round(cv.clientWidth*renderScale)),h=Math.max(1,Math.round(cv.clientHeight*renderScale));
  if(cv.width===w&&cv.height===h)return;cv.width=w;cv.height=h;gl.viewport(0,0,w,h)};
 new ResizeObserver(fit).observe($('#stage'));fit();
 cv.addEventListener('webglcontextlost',e=>{e.preventDefault();glLost=true});
 cv.addEventListener('webglcontextrestored',()=>{glLost=false;initProgram();gl.viewport(0,0,cv.width,cv.height)});
 (function frame(now){
  if(glLost){requestAnimationFrame(frame);return}
  const idleish=(mode==='idle'||mode==='sleep'||mode==='off');
  // ~30 fps when nothing is happening: less GPU contention with the local model.
  if(idleish&&now-last<33){requestAnimationFrame(frame);return}
  const rawDt=(now-last)/1000;
  const dt=Math.min(rawDt,.05);last=now;t+=dt;let br=0;
  // Adaptive resolution: if the shader cannot hold ~30 fps, render fewer pixels instead of stuttering.
  if(rawDt<.25&&!idleish){slowT+=rawDt;slowN++;if(slowN>=90){const avg=slowT/slowN;slowT=0;slowN=0;if(avg>.034&&renderScale>.55){renderScale=Math.max(.55,renderScale*.8);fit()}}}
  const m=mode;
  if(m==='idle'){ampT=.004;freq=.5}
  else if(m==='sleep'||m==='off'){ampT=.002;freq=.3}
  else if(m==='listen'){ampT=.014+.016*impulse;freq=2.0}
  else if(m==='think'){ampT=.012+.004*Math.sin(t*1.3);freq=.9;if(t>nextRing){ripple(.6);nextRing=t+1.4}}
  else if(m==='verify'){ampT=.015+.006*Math.sin(t*3.1);freq=1.7;if(t>nextRing){ripple(.5);nextRing=t+.8}}
  else{freq=3.2+2.2*Math.sin(t*.9)+1.4*Math.sin(t*2.3+1);ampT=.016+.028*impulse+.012*(.5+.5*Math.sin(t*1.7))}
  impulse*=Math.exp(-dt*4.5);
  amp+=(ampT-amp)*Math.min(1,dt*(m==='speak'?9:3));
  phase+=dt*freq*Math.PI;if(m==='speak')br=Math.sin(phase)*amp*1.6;
  tw+=dt*(m==='speak'?1+freq*.12:1);
  th+=((m==='think'||m==='verify'?1:0)-th)*Math.min(1,dt*4);
  sp+=((m==='speak'?1:m==='listen'?.55:0)-sp)*Math.min(1,dt*5);
  sv+=(-120*sq-12*sv)*dt;sq=Math.max(-0.06,Math.min(0.06,sq+sv*dt));
  tm+=(tgtTm-tm)*Math.min(1,dt*3);dim+=(tgtDim-dim)*Math.min(1,dt*2);
  tn=tn.map((v,i)=>v+(tgtTn[i]-v)*Math.min(1,dt*4));
  rings=rings.filter(r=>t-r.t0<2.8);rip.fill(0);rings.forEach((r,i)=>{rip[i*2]=t-r.t0;rip[i*2+1]=r.s});
  gl.uniform2f(U.u_res,cv.width,cv.height);gl.uniform1f(U.u_t,t);gl.uniform1f(U.u_tw,tw);gl.uniform1f(U.u_amp,amp);
  gl.uniform1f(U.u_imp,impulse);gl.uniform1f(U.u_think,th);gl.uniform1f(U.u_speak,sp);gl.uniform1f(U.u_f,freq);
  gl.uniform1f(U.u_br,br);gl.uniform1f(U.u_sq,sq);gl.uniform1f(U.u_dark,dark()?1:0);gl.uniform1f(U.u_bob,Math.sin(t*.7)*.025);
  gl.uniform2fv(U.u_rip,rip);gl.uniform3f(U.u_tn,tn[0],tn[1],tn[2]);gl.uniform1f(U.u_tm,tm);gl.uniform1f(U.u_dim,dim);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame);
 })(last);
}

function setState(s){
 lastActivity=Date.now();
 if(mode===s&&document.body.dataset.state===s)return;
 mode=s;document.body.dataset.state=s;
 $('#hint').textContent=HINT[s]||'';
 $('#sl').textContent=s==='sleep'?'Wake up':'Sleep';
 cv.style.opacity=s==='off'?0:1;
 tgtTm=s==='verify'?.85:s==='sleep'?1:0;
 tgtDim=s==='sleep'?1:0;
 if(s==='verify')tgtTn=TINT.amber;
 else if(s==='sleep')tgtTn=TINT.slate;
 else tgtTn=TINT.cyan;
 const locked=(s==='think'||s==='verify');
 $('#mic').disabled=locked||s==='sleep'||s==='off';
 $('#send').disabled=locked||s==='sleep'||s==='off';
 $cmd.classList.toggle('off',s==='sleep'||s==='off');
 $('#mic').classList.toggle('active',s==='listen');
}

const flash=(c,ms)=>{tgtTn=TINT[c];tgtTm=.75;setTimeout(()=>{if(mode!=='sleep'&&mode!=='verify')tgtTm=0},ms)};

// ---------- Safe text rendering (model output is never parsed as HTML) ----------
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(t){
 return t
  .replace(/`([^`\n]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>'<a href="#" data-url="'+u+'">'+a+'</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(m,p,u)=>p+'<a href="#" data-url="'+u+'">'+u+'</a>')
  .replace(/\[S(\d+)\]/g,'<sup class="c" data-i="$1">$1</sup>');
}
function md(src){
 const parts=String(src).split(/```/);let out='';
 parts.forEach((seg,i)=>{
  if(i%2===1){const nl=seg.indexOf('\n');const code=nl>=0?seg.slice(nl+1):seg;out+='<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>';return}
  let list=null,para=[];
  const flush=()=>{if(para.length){out+='<p>'+inline(para.join('<br>'))+'</p>';para=[]}};
  const closeList=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const ln of esc(seg).split('\n')){
   let m;
   if(!ln.trim()){flush();closeList();continue}
   if((m=ln.match(/^\s{0,3}(#{1,4})\s+(.*)$/))){flush();closeList();out+='<h4>'+inline(m[2])+'</h4>';continue}
   if((m=ln.match(/^\s*[-*•]\s+(.*)$/))){flush();if(list!=='ul'){closeList();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>';continue}
   if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){flush();if(list!=='ol'){closeList();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>';continue}
   if(/^\s*---+\s*$/.test(ln)){flush();closeList();out+='<hr>';continue}
   closeList();para.push(ln);
  }
  flush();closeList();
 });
 return out;
}

// ---------- Chat ----------
let cur=null,lastUser={text:'',t:0};
const nearBottom=()=>$chat.scrollHeight-$chat.scrollTop-$chat.clientHeight<90;
const toBottom=()=>{$chat.scrollTop=$chat.scrollHeight};
function reveal(){document.body.classList.remove('empty')}
function addUser(text){
 reveal();
 const d=document.createElement('div');d.className='msg user';
 const b=document.createElement('div');b.className='bubble';b.textContent=text;d.appendChild(b);
 $msgs.appendChild(d);lastUser={text,t:Date.now()};toBottom();
}
function addBot(){
 reveal();
 const d=document.createElement('div');d.className='msg bot';
 const body=document.createElement('div');body.className='body';d.appendChild(body);
 $msgs.appendChild(d);toBottom();
 return {el:d,body,sources:[],hasText:false};
}
function setPending(m,text){m.body.innerHTML='<span class="dots">'+esc((text||'Thinking').replace(/[\u2026.]+$/,''))+'</span>'}
function normSources(src){
 return (src||[]).map((s,i)=>Array.isArray(s)?{id:s[0],title:s[1],url:'',domain:s[2]||''}:{id:s.id||('S'+(i+1)),title:s.title||s.url||'',url:s.url||'',domain:s.domain||''});
}
function renderSources(m,sources){
 m.sources=normSources(sources);m.el._src=m.sources;
 const old=m.el.querySelector('details.src');if(old)old.remove();
 if(!m.sources.length)return;
 const d=document.createElement('details');d.className='src';
 d.innerHTML='<summary>Sources ('+m.sources.length+')</summary>'+m.sources.map(s=>'<div class="s"><span class="n">'+esc(s.id)+'</span><a href="#" data-url="'+esc(s.url)+'">'+esc(s.title)+'</a><span class="dom">'+esc(s.domain)+'</span></div>').join('');
 m.el.appendChild(d);
}
function renderMeta(m,meta){
 const old=m.el.querySelector('.chk');if(old)old.remove();
 const c=meta&&meta.checked;
 if(!c||!c.total)return;
 const rt=meta.roundtable;
 const ok=!(c.unverified&&c.unverified.length);
 let line=(ok?'Checked':'Partly checked')+' · '+c.supported+' of '+c.total+' claims supported';
 if(rt)line+=' · second opinion '+(rt.independent?'':'(same model) ')+(rt.decision==='approve'?'agrees':'suggested changes');
 if(meta.improved)line+=' · improved';
 const items=[].concat((c.unverified||[]).map(x=>'Not confirmed: '+x),(rt&&rt.changes)||[]);
 const el=document.createElement(items.length?'details':'div');el.className='chk';
 el.innerHTML=items.length?('<summary>'+esc(line)+'</summary>'+items.map(i=>'<div class="s">'+esc(i)+'</div>').join('')):esc(line);
 m.el.appendChild(el);
}
function openUrl(u){
 if(!u)return;
 if(navigator.userAgent.includes('QtWebEngine'))notifyPython('on_open_url',{url:u});
 else window.open(u,'_blank','noopener');
}
document.addEventListener('click',e=>{
 const a=e.target.closest('a[data-url]');
 if(a){e.preventDefault();openUrl(a.dataset.url);return}
 const c=e.target.closest('sup.c');
 if(c){const m=c.closest('.msg');const s=m&&m._src&&m._src[Number(c.dataset.i)-1];if(s)openUrl(s.url);return}
 if(!e.target.closest('.dd'))closeMenu();
});

// ---------- IPC bridge ----------
try{
 const s=document.createElement('script');s.src='qrc:///qtwebchannel/qwebchannel.js';
 s.onload=()=>{if(window.QWebChannel&&window.qt&&window.qt.webChannelTransport){new QWebChannel(qt.webChannelTransport,ch=>{window.bridge=ch.objects.pyBridge})}};
 document.head.appendChild(s);
}catch(e){}
function notifyPython(action,payload){
 if(window.bridge&&window.bridge.send_action){try{window.bridge.send_action(action,JSON.stringify(payload||{}));return}catch(e){}}
 const data=JSON.stringify({action:action,payload:payload||{},ts:Date.now()});
 try{document.title="lora://"+encodeURIComponent(data)}catch(e){}
 try{const f=document.createElement("iframe");f.style.display="none";f.src="lora://"+action+"?payload="+encodeURIComponent(JSON.stringify(payload||{}));document.body.appendChild(f);setTimeout(()=>f.remove(),100)}catch(e){}
}
const isQt=()=>navigator.userAgent.includes('QtWebEngine');

// ---------- Sending ----------
async function executeUserQuery(v){
 if(busy||mode==='think'||mode==='verify'||mode==='sleep'||mode==='off')return;
 v=(v||'').trim();if(!v)return;
 busy=true;$q.value='';
 addUser(v);cur=addBot();cur.pending=true;setPending(cur,'Thinking');
 setState('think');
 notifyPython('on_user_submit',{text:v});
 if(isQt())return;
 // Plain browser (no desktop app): use the local gateway.
 for(const port of [8765,8000]){
  try{
   const res=await fetch('http://127.0.0.1:'+port+'/api/hud/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v})});
   if(res.ok){const data=await res.json();if(data&&data.answer){await window.finishTurn(v,data.answer,data.sources||[],0,'',false);return}}
  }catch(e){}
 }
 if(cur){cur.body.innerHTML='';const n=document.createElement('div');n.className='notice';n.textContent='I can\u2019t reach the LORA desktop app right now.';cur.body.appendChild(n)}
 cur=null;busy=false;setState('idle');
}

// ---------- Voice / push-to-talk ----------
function startPTT(){
 if(busy||mode==='think'||mode==='verify'||mode==='sleep'||mode==='off')return;
 setState('listen');
 notifyPython('on_ptt_down',{});
}
function stopPTT(){
 if(mode==='listen'){setState('think');$('#hint').textContent='Transcribing…'}
 notifyPython('on_ptt_up',{});
}
function bargeIn(){pulse(0.8);setState('listen');setTimeout(()=>{if(mode==='listen')setState('idle')},1400)}
const toggleSleep=()=>{
 busy=false;
 const newS=(mode==='sleep'||mode==='off'?'idle':'sleep');
 setState(newS);notifyPython('on_sleep_toggle',{is_sleeping:newS==='sleep'});
};

$cmd.onsubmit=e=>{e.preventDefault();executeUserQuery($q.value)};
$('#hit').onmousedown=()=>{
 if(mode==='sleep'||mode==='off')toggleSleep();
 else if(mode==='speak')bargeIn();
 else if(mode==='idle'||mode==='listen'){pttActive=true;startPTT()}
};
$('#mic').onmousedown=()=>{pttActive=true;startPTT()};
$('#sl').onclick=()=>{closeMenu();toggleSleep()};
$('#off').onclick=()=>{closeMenu();busy=false;setState('off');notifyPython('on_turn_off',{})};
$('#vo').onclick=()=>{voice=!voice;$('#vo').textContent='Voice '+(voice?'on':'off');closeMenu();notifyPython('on_voice_toggle',{enabled:voice})};

// Keyboard: ONE handler. Space = hold to talk (ignored while typing, ignores key-repeat).
const typing=()=>{const t=document.activeElement&&document.activeElement.tagName;return t==='INPUT'||t==='TEXTAREA'};
const endPTT=()=>{if(pttActive){pttActive=false;stopPTT()}};
addEventListener('keydown',e=>{
 if(e.code==='Space'){
  if(typing())return;
  e.preventDefault();
  if(e.repeat||pttActive||busy||mode==='think'||mode==='verify'||mode==='sleep'||mode==='off')return;
  pttActive=true;startPTT();return;
 }
 if(e.ctrlKey&&e.altKey&&e.code==='KeyS'){e.preventDefault();toggleSleep();return}
 if(e.key==='Escape'){if(mode==='speak')bargeIn();else closeMenu()}
});
addEventListener('keyup',e=>{if(e.code==='Space'&&pttActive){e.preventDefault();endPTT()}});
addEventListener('blur',endPTT);
addEventListener('mouseup',endPTT);

// ---------- "Add sources" menu ----------
function closeMenu(){for(const [m,b] of [['#srcmenu','#srcbtn'],['#moremenu','#morebtn']]){$(m).hidden=true;$(b).setAttribute('aria-expanded','false')}}
for(const [m,b] of [['#srcmenu','#srcbtn'],['#moremenu','#morebtn']]){$(b).onclick=e=>{e.stopPropagation();const menu=$(m),open=menu.hidden;closeMenu();menu.hidden=!open;$(b).setAttribute('aria-expanded',String(open))}}
async function api(path,body){
 for(const port of [8765,8000]){
  try{const res=await fetch('http://127.0.0.1:'+port+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(res.ok)return await res.json()}catch(e){}
 }
 return null;
}
$('#m-browse').onclick=()=>notifyPython('on_browse_media',{});
$('#m-add').onclick=async()=>{
 const p=$('#m-path').value.trim();if(!p)return;
 $('#m-path').value='';notifyPython('on_add_media_file',{path:p});
 if(!isQt()){const d=await api('/api/hud/media/add',{path:p});if(d&&d.files)window.updateMediaList(d.files)}
};
$('#m-report').onclick=async()=>{
 closeMenu();notifyPython('on_report_media',{query:''});
 if(!isQt()){
  const d=await api('/api/hud/media/report',{query:''});
  if(d){const rep=d.report||{};await window.finishTurn('Summarize my sources',(rep.summary||'')+'\n\n'+(rep.findings||[]).join('\n'),[],0,'',false)}
 }
};

// ---------- Python / page API ----------
window.setDropletState=(st)=>{
 lastActivity=Date.now();setState(st);
 if(st==='idle'||st==='sleep'||st==='off'){busy=false;streaming=false;if(cur&&cur.pending&&!cur.hasText){cur.el.remove()}cur=null}
};
window.setAudioLevel=(lvl)=>{
 if(lvl>0.08){impulse=Math.min(1.0,Math.max(impulse,lvl*0.8))}
};
window.pulseDroplet=(amt)=>pulse(amt||0.4);
window.setQuestion=()=>{};
window.setMicStatus=(ok,text)=>{
 const m=$('#micst');m.className=ok?'ok':'bad';
 $('#mictx').textContent=ok?'':('Microphone off: '+text);
 m.title=ok?('Microphone: '+text):('Microphone off: '+text);
};
window.setStatus=(t)=>{if(cur&&!cur.hasText)setPending(cur,t)};
window.beginStream=(q)=>{
 lastActivity=Date.now();streaming=true;busy=true;
 if(cur&&cur.pending&&lastUser.text===q&&Date.now()-lastUser.t<8000){/* typed here: bubble already shown */}
 else{if(q)addUser(q);cur=addBot();cur.pending=true;setPending(cur,'Thinking')}
 setState('think');
};
window.streamUpdate=(text)=>{
 if(!streaming||!cur)return;
 lastActivity=Date.now();
 const stick=nearBottom();
 cur.hasText=true;cur.body.innerHTML=md(text);
 if(stick)toBottom();
};
window.finishTurn=async(q,text,sources,conf,label,streamed,meta)=>{
 busy=false;streaming=false;
 const stick=nearBottom();
 if(!cur||!streamed){ if(!cur||!(cur.pending&&lastUser.text===q)){if(q)addUser(q);cur=addBot()} }
 cur.pending=false;cur.hasText=true;cur.body.innerHTML=md(text);
 renderSources(cur,sources);
 renderMeta(cur,meta);
 cur=null;
 if(stick)toBottom();
 if(!streamed){await sleep(150);setState('idle')}
};
window.addMessage=(sender,text)=>{
 const s=String(sender).toLowerCase();
 if(s==='you'||s==='user')return; // the question is shown by beginStream
 reveal();
 const n=document.createElement('div');n.className='notice';n.textContent=text;
 if(cur&&cur.pending&&!cur.hasText){cur.el.before(n)}else $msgs.appendChild(n);
 toBottom();
};
window.updateMediaList=(files)=>{
 const box=$('#media-list');box.innerHTML='';
 $('#srcbtn').textContent=(files&&files.length)?('Sources ('+files.length+')'):'Add sources';
 if(!files||!files.length){box.innerHTML='<div class="m-empty">Nothing added yet. Add PDFs, notes or text files and I can use them in my answers.</div>';return}
 files.forEach(f=>{
  const item=document.createElement('div');item.className='m-item';
  item.innerHTML='<span class="m-name" title="'+esc(f.path)+'">'+esc(f.filename)+'</span><button class="m-del" title="Remove" aria-label="Remove">×</button>';
  item.querySelector('.m-del').onclick=async()=>{
   notifyPython('on_remove_media_file',{path_or_id:f.file_id});
   if(!isQt()){const d=await api('/api/hud/media/remove',{path_or_id:f.file_id});if(d&&d.files)window.updateMediaList(d.files)}
  };
  box.appendChild(item);
 });
};

// Watchdog: never stay locked in think/verify if the backend went quiet.
setInterval(()=>{
 if((mode==='think'||mode==='verify')&&Date.now()-lastActivity>240000){
  busy=false;streaming=false;
  if(cur){cur.body.innerHTML='';const n=document.createElement('div');n.className='notice';n.textContent='I didn\u2019t get an answer. Please try again.';cur.body.appendChild(n);cur=null}
  setState('idle');
 }
},5000);

// ---------- Start ----------
window.updateMediaList([]);
setState('idle');
setTimeout(async()=>{
 if(isQt())return;
 const d=await api('/api/hud/media/list');if(d&&d.files)window.updateMediaList(d.files);
},1200);
</script>
