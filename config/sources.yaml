# LORA Free Knowledge Sources Configuration
sources:
  wikipedia:
    enabled: true
    tier: 2
    rate_limit_rps: 2.0
    endpoint: "https://en.wikipedia.org/w/api.php"
    requires_key: false

  wikidata:
    enabled: true
    tier: 2
    rate_limit_rps: 2.0
    endpoint: "https://www.wikidata.org/w/api.php"
    requires_key: false

  arxiv:
    enabled: true
    tier: 1
    is_preprint: true
    rate_limit_rps: 0.33  # 1 request per 3 seconds
    endpoint: "https://export.arxiv.org/api/query"
    requires_key: false

  crossref:
    enabled: true
    tier: 1
    rate_limit_rps: 5.0
    endpoint: "https://api.crossref.org/works"
    requires_key: false

  hackernews:
    enabled: true
    tier: 4
    rate_limit_rps: 5.0
    endpoint: "https://hn.algolia.com/api/v1/search"
    requires_key: false
