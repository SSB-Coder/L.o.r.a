# LORA v1.5: RTX 3050 6 GB VRAM / 16 GB RAM.
# Path access and budgets are enforced by config/policy.yaml.
models_dir: models
voice:
  headset_mode: false
  close_mic_on_sleep: false  # continuous addressed wake listening, as requested
  wake:
    engine: transcript
    model: models/voice/awaken_lora.onnx
    speaker_verifier:
      enabled: true
      model: ~/.lora/voice/user_verifier.json
      threshold: 0.55
  # Desktop STT is CPU-only; thread/confidence tuning remains in voice/stt.py.
  stt:
    model: base.en
    compute: int8
    initial_prompt: Hey LORA, Awaken LORA, arXiv, RAG, Ollama, Python, VS Code, GitHub,
      Hugging Face, Granite, Gemma, Qwythos, Spark, Kokoro, Wikipedia, ChatGPT
  # Kokoro CPU profiles and voice selection are owned by the desktop/HUD.
# Optional neural-router reference settings; normal routing uses predict_fast.
decision:
  checkpoint: models/laya-lora-ft
  base_fallback: convaiinnovations/laya
  device: cpu
  tau: 0.7
  risky_threshold: 0.3
  calibration_file: config/laya_calibration.json
# Reference gateway defaults; actual listeners use CLI arguments and LAN detection.
gateway:
  desktop_bind: 127.0.0.1:8765
  mobile_bind: 192.168.50.10:8765
  auth:
    desktop_token_env: LORA_DESKTOP_TOKEN
    mobile_token_env: LORA_MOBILE_TOKEN
    rate_limit_failed_attempts: 5
  max_concurrent_llm_jobs: 1
  mobile:
    max_tier: 0
    max_run_mode: standard
    allow_uploads: false
    allow_local_files: false
models:
  planner:
    name: hf.co/XHToken/Spark-X2.6-4B-GGUF:Q4_K_M
    think: false
    num_ctx: 8192
    fallback:
    - granite4.2:8b
  controller:
    name: granite4.2:3b
    think: false
    num_ctx: 6144
    fallback:
    - granite4.2:8b
  writer:
    name: hf.co/XHToken/Spark-X2.6-4B-GGUF:Q4_K_M
    family: spark
    think: false
    temperature: 0.3
    num_ctx: 8192
    fallback:
    - spark-x26-4b
    - granite4.2:3b
    - gemma4:e4b
  complex:
    name: granite4.2:8b
    think: false
    temperature: 0.2
    num_ctx: 8192
    fallback:
    - hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest
    - ornith-1.5:9b
    - hf.co/XHToken/Spark-X2.6-4B-GGUF:Q4_K_M
  vision:
    name: gemma4:e4b
    think: false
    temperature: 0.2
    num_ctx: 8192
    fallback:
    - gemma3:4b
    - llava:latest
    - qwen2.5vl:latest
    - hf.co/XHToken/Spark-X2.6-4B-GGUF:Q4_K_M
  reader:
    name: hf.co/XHToken/Spark-X2.6-4B-GGUF:Q4_K_M
    family: spark
    think: false
    temperature: 0.2
    num_ctx: 8192  # shared with writer/planner to avoid reloading between roles
    fallback:
    - spark-x26-4b
    - granite4.2:3b
  # Standalone experiments only; ordinary research does not run these roles.
  verifier:
    name: granite4.2:3b
    think: false
    num_ctx: 6144
    temperature: 0.0
    fallback:
    - granite4.2:8b
  supervisor:
    name: granite4.2:8b
    think: false
    num_ctx: 6144
    temperature: 0.0
    fallback:
    - granite4.2:3b
  optimizer:
    name: gemma4:e4b
    think: false
    num_ctx: 8192
    fallback:
    - granite4.2:3b
    - gemma4:e4b
  ollama_env:
    OLLAMA_MAX_LOADED_MODELS: 1
    base_url: http://127.0.0.1:11434
# NLI/reranker entries describe optional experiments; normal page RAG uses CPU embeddings.
grounding:
  nli_fast: vectara-hhem-2.1-open
  nli_secondary: minicheck
  embedder: models/embeddinggemma2
  vector_store: numpy
  reranker: bge-reranker-base
research:
  max_sources: 12
  evidence_cards: 10
  min_entailment: 0.8
  copy_overlap_max_ngram: 8
  query_mode_min_similarity: 0.35
# Standalone experimental reference values; explicit callers supply loop budgets.
outerloop:
  max_iters: 5
  epsilon: auto
  wallclock_minutes: 20
  faithfulness_floor: 0.85
# Reference capability profile; config/policy.yaml is the effective action policy.
safety:
  max_actions_per_task: 15
  dry_run_over: 3
  killswitch: ctrl+alt+shift+esc
  allowed_roots:
  - ~/Documents
  - ~/Downloads
  - ~/Desktop
  - ~/LORA/outputs
  safe_extensions:
  - .pdf
  - .md
  - .txt
  - .png
  - .jpg
  - .jpeg
  blocked_extensions:
  - .exe
  - .bat
  - .cmd
  - .ps1
  - .lnk
  - .js
  - .vbs
  - .reg
  - .docm
  - .xlsm
  - .pptm
