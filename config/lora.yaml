# LORA v1.5: RTX 3050 6 GB VRAM / 16 GB RAM.
# Path access and budgets are enforced by config/policy.yaml.
models_dir: models
voice:
  mode: quality
  headset_mode: false
  close_mic_on_sleep: false  # continuous addressed wake listening, as requested
  wake:
    engine: transcript
    model: models/voice/awaken_lora.onnx
    threshold: 0.65
    consecutive: 2
    vad_gate: true
    preroll_ms: 500
    speaker_verifier:
      enabled: true
      model: ~/.lora/voice/user_verifier.json
      threshold: 0.55
  hotkey: ctrl+alt+space
  vad: silero
  stt:
    engine: faster-whisper
    model: base.en
    device: cpu
    compute: int8
    beam: 1
    vad_filter: true
    min_avg_logprob: -0.7
    max_no_speech_prob: 0.6
    initial_prompt: Hey LORA, Awaken LORA, arXiv, RAG, Ollama, Python, VS Code, GitHub,
      Hugging Face, Granite, Gemma, Qwythos, Spark, Kokoro, Wikipedia, ChatGPT
    threads: 4
  stt_fallback:
  - moonshine
  - parakeet-sherpa-onnx
  tts_quality:
    engine: kokoro-onnx
    model_path: models/kokoro/kokoro-v1.0.onnx
    voices_path: models/kokoro/voices-v1.0.bin
    speaker: af_sky
    lang: en-us
    speed: 1.0
  tts_fast:
    engine: kokoro-onnx
    voice: af_sky
decision:
  checkpoint: models/laya-lora-ft
  base_fallback: convaiinnovations/laya
  device: cpu
  tau: 0.7
  risky_threshold: 0.3
  calibration_file: config/laya_calibration.json
gateway:
  desktop_bind: 127.0.0.1:8765
  mobile_bind: 192.168.50.10:8765
  auth:
    desktop_token_env: LORA_DESKTOP_TOKEN
    mobile_token_env: LORA_MOBILE_TOKEN
    rate_limit_failed_attempts: 5
  max_concurrent_llm_jobs: 1
  mobile:
    max_tier: 0
    max_run_mode: standard
    allow_uploads: false
    allow_local_files: false
models:
  planner:
    name: gemma4:e4b
    think: false
    num_ctx: 8192
    fallback:
    - granite4.2:8b
  controller:
    name: granite4.2:3b
    think: false
    num_ctx: 6144
    fallback:
    - granite4.2:8b
  writer:
    name: spark-x25-4b-8k:latest
    family: spark
    think: false
    temperature: 0.3
    num_ctx: 8192
    fallback:
    - spark-x25-4b-q4
    - granite4.2:3b
    - gemma4:e4b
  complex:
    name: granite4.2:8b
    think: false
    temperature: 0.2
    num_ctx: 8192
    fallback:
    - hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest
    - ornith-1.5:9b
    - spark-x25-4b-8k:latest
  vision:
    name: gemma4:e4b
    think: false
    temperature: 0.2
    num_ctx: 8192
    fallback:
    - gemma3:4b
    - llava:latest
    - qwen2.5vl:latest
    - spark-x25-4b-8k:latest
  reader:
    name: spark-x25-4b-32k:latest
    family: spark
    think: false
    temperature: 0.2
    num_ctx: 32768
    fallback:
    - spark-x25-4b-8k:latest
    - spark-x25-4b-q4
  verifier:
    name: granite4.2:3b
    think: false
    num_ctx: 6144
    temperature: 0.0
    fallback:
    - granite4.2:8b
  supervisor:
    name: granite4.2:8b
    think: false
    num_ctx: 6144
    temperature: 0.0
    fallback:
    - granite4.2:3b
  optimizer:
    name: gemma4:e4b
    think: false
    num_ctx: 8192
    fallback:
    - granite4.2:3b
    - gemma4:e4b
  excluded:
  - gemma4:26b
  - 26b
  - 27b
  - 32b
  - 70b
  ollama_env:
    OLLAMA_MAX_LOADED_MODELS: 1
    base_url: http://127.0.0.1:11434
grounding:
  nli_fast: vectara-hhem-2.1-open
  nli_secondary: minicheck
  embedder: models/embeddinggemma2
  vector_store: numpy
  reranker: bge-reranker-base
research:
  max_sources: 12
  evidence_cards: 10
  min_entailment: 0.8
  copy_overlap_max_ngram: 8
  query_mode_min_similarity: 0.35
outerloop:
  max_iters: 5
  epsilon: auto
  wallclock_minutes: 20
  faithfulness_floor: 0.85
mcp:
  enabled: false
browser:
  ask_other_ai_tier: 2
  enabled_services:
    chatgpt: true
    perplexity: true
    gemini: true
    claude: false
safety:
  max_actions_per_task: 15
  dry_run_over: 3
  killswitch: ctrl+alt+shift+esc
  allowed_roots:
  - ~/Documents
  - ~/Downloads
  - ~/Desktop
  - ~/LORA/outputs
  safe_extensions:
  - .pdf
  - .md
  - .txt
  - .png
  - .jpg
  - .jpeg
  blocked_extensions:
  - .exe
  - .bat
  - .cmd
  - .ps1
  - .lnk
  - .js
  - .vbs
  - .reg
  - .docm
  - .xlsm
  - .pptm
