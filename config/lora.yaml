# LORA Master Configuration (v1.5 Plan Aligned — Local models/ + Spark 4B Base + 8B/9B Escalation)
models_dir: "models"

voice:
  mode: quality                     # quality | fast | auto
  headset_mode: false               # false = pause wake/VAD during speaker TTS to prevent self-interruption
  wake:
    engine: openwakeword
    model: models/voice/hey_lora.onnx
    threshold: 0.65
    consecutive: 2
    vad_gate: true
    preroll_ms: 500
    speaker_verifier:
      enabled: true
      model: models/voice/user_verifier.onnx
      threshold: 0.70
  hotkey: "ctrl+alt+space"
  vad: silero
  stt:
    engine: faster-whisper
    model: base.en
    device: cpu
    compute: int8
    beam: 3
    vad_filter: false
    min_avg_logprob: -0.70
    max_no_speech_prob: 0.60
    initial_prompt: "Hey LORA, Awaken LORA, arXiv, RAG, Ollama, Python, VS Code, GitHub, Hugging Face, Granite, Gemma, Qwythos, Spark, Kokoro, Wikipedia, ChatGPT"
  stt_fallback: [moonshine, parakeet-sherpa-onnx]
  tts_quality:
    engine: kokoro-onnx
    model_path: "models/kokoro/kokoro-v1.0.onnx"
    voices_path: "models/kokoro/voices-v1.0.bin"
    speaker: af_sky
    lang: en-us
    speed: 1.0
  tts_fast:
    engine: kokoro-onnx
    voice: af_sky

decision:                         # Laya decision model (local models/laya-lora-ft on CPU, 0 MB VRAM)
  checkpoint: models/laya-lora-ft
  base_fallback: convaiinnovations/laya
  device: cpu
  tau: 0.70
  risky_threshold: 0.30
  calibration_file: config/laya_calibration.json

gateway:
  desktop_bind: "127.0.0.1:8765"
  mobile_bind: "192.168.50.10:8765"    # router-side IP only, NEVER 0.0.0.0
  auth:
    desktop_token_env: LORA_DESKTOP_TOKEN
    mobile_token_env: LORA_MOBILE_TOKEN
    rate_limit_failed_attempts: 5      # max 5 failed auth/min -> 15 min ban
  max_concurrent_llm_jobs: 1
  mobile:
    max_tier: 0                        # strictly Tier 0 (read-only research/Q&A)
    max_run_mode: "standard"           # quick | standard (no deep/outerloop)
    allow_uploads: false
    allow_local_files: false

models:                           # Model role assignments (Spark 4B base + 8B/9B smart escalation, fixed num_ctx=8192)
  planner:
    name: "granite4.2:8b"
    think: false
    num_ctx: 8192
    fallback: ["hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest", "gemma4:e4b", "spark-x25-4b-8k:latest"]
  controller:
    name: "granite4.2:8b"
    think: false
    num_ctx: 8192
    fallback: ["hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest", "ornith-1.5:9b", "gemma4:e4b", "spark-x25-4b-8k:latest"]
  writer:
    name: "spark-x25-4b-q4"
    family: spark
    think: false
    temperature: 0.3
    num_ctx: 8192                      # 8k context cap for fast base writer
    fallback: ["gemma4:e4b", "granite4.2:8b", "hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest", "ornith-1.5:9b", "granite4.2:3b"]
  complex:
    name: "granite4.2:8b"
    think: false
    temperature: 0.2
    num_ctx: 8192
    fallback: ["hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest", "ornith-1.5:9b", "gemma4:e4b", "spark-x25-4b-q4"]
  vision:
    name: "gemma4:e4b"
    think: false
    temperature: 0.2
    num_ctx: 8192
    fallback: ["gemma3:4b", "llava:latest", "qwen2.5vl:latest", "granite4.2:8b", "spark-x25-4b-q4"]
  reader:
    name: "spark-x25-4b-32k:latest"
    family: spark
    think: false
    temperature: 0.2
    num_ctx: 32768                     # 32k context exclusively for long-doc map-reduce
    fallback: ["spark-x25-4b-q4", "granite4.2:8b"]
  verifier:
    name: "gemma4:e4b"
    think: false
    num_ctx: 4096
    temperature: 0.0
    fallback: ["granite4.2:3b", "granite4.2:8b", "hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest", "ornith-1.5:9b"]
  supervisor:
    name: "hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest"
    think: false
    num_ctx: 8192
    temperature: 0.0
    fallback: ["granite4.2:8b", "ornith-1.5:9b"]
  optimizer:
    name: "gemma4:e4b"
    think: false
    num_ctx: 8192
    fallback: ["granite4.2:8b", "hf.co/empero-ai/Qwythos-9B-v2-GGUF:latest"]
  excluded:
    - "gemma4:26b"
  ollama_env:
    OLLAMA_MAX_LOADED_MODELS: 1
    base_url: "http://127.0.0.1:11434"

grounding:
  nli_fast: vectara-hhem-2.1-open
  nli_secondary: minicheck
  embedder: "models/embeddinggemma2"         # local repo models/embeddinggemma2 (or models/embeddinggemma-2)
  vector_store: faiss                        # faiss-cpu session-bound index
  reranker: bge-reranker-base

research:
  max_sources: 12
  evidence_cards: 10
  min_entailment: 0.80
  copy_overlap_max_ngram: 8
  query_mode_min_similarity: 0.35

outerloop:
  max_iters: 8
  epsilon: auto
  wallclock_minutes: 20
  faithfulness_floor: 0.85

mcp:
  enabled: false                             # v1.5 Plan: disabled by default in v1

browser:
  ask_other_ai_tier: 2                       # v1.5 Plan: Tier 2 (requires user confirmation)
  enabled_services:
    chatgpt: true
    perplexity: true
    gemini: true
    claude: false                            # v1.5 Plan: claude.ai disabled by default

safety:
  max_actions_per_task: 15                   # v1.5 Plan: tightened from 40 to 15
  dry_run_over: 3
  killswitch: "ctrl+alt+shift+esc"
  allowed_roots:
    - "C:\\Users"
  safe_extensions:
    - ".pdf"
    - ".md"
    - ".txt"
    - ".csv"
    - ".docx"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".svg"
    - ".py"
    - ".html"
    - ".json"
    - ".yaml"
    - ".yml"
  blocked_extensions:
    - ".exe"
    - ".bat"
    - ".cmd"
    - ".ps1"
    - ".lnk"
    - ".js"
    - ".vbs"
    - ".reg"
    - ".docm"
    - ".xlsm"
    - ".pptm"
