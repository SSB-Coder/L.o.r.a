# L.O.R.A Desktop Applications and Web Apps Allowlist
version: "1.0"

# Desktop Applications: maps user-friendly names to executable names or paths.
# Strictly excludes shells (cmd, powershell, wt, bash), installers, and administrative tools.
# commands maps Python platform names to ordered executable alternatives.
# desktop_ids lists approved Linux desktop launchers (also works with Flatpak).
applications:
  zed:
    name: "Zed"
    command: "zed"
    commands:
      linux: ["zed", "zeditor"]
    desktop_ids: ["dev.zed.Zed.desktop"]
    aliases: ["zed editor", "zed ide", "zed code editor"]
  vscode:
    name: "Visual Studio Code"
    command: "code"
    aliases: ["code", "vs code", "visual studio code"]
  notepad:
    name: "Notepad"
    command: "notepad.exe"
    linux_command: "gnome-text-editor"
    aliases: ["text editor", "notes"]
  calculator:
    name: "Calculator"
    command: "calc.exe"
    linux_command: "gnome-calculator"
    aliases: ["calc"]
  edge:
    name: "Microsoft Edge"
    command: "msedge.exe"
    linux_command: "firefox"
    aliases: ["msedge", "browser"]
  chrome:
    name: "Google Chrome"
    command: "chrome.exe"
    linux_command: "google-chrome"
    aliases: ["google chrome"]
  spotify:
    name: "Spotify"
    command: "spotify.exe"
    linux_command: "spotify"
    aliases: ["music"]
  paint:
    name: "Paint"
    command: "mspaint.exe"
    linux_command: "pinta"
    aliases: ["mspaint"]
  explorer:
    name: "File Explorer"
    command: "explorer.exe"
    linux_command: "nautilus"
    aliases: ["files", "file manager"]
  obsidian:
    name: "Obsidian"
    command: "Obsidian.exe"
    windows_paths: ['%LOCALAPPDATA%/Obsidian/Obsidian.exe', '%LOCALAPPDATA%/Programs/Obsidian/Obsidian.exe']
    linux_command: "obsidian"
    aliases: ["obsidian", "graph book", "vault", "notes vault", "obsidian vault"]
  xournal:
    name: "Xournal++"
    command: "xournalpp.exe"
    windows_paths: ['%ProgramFiles%/Xournal++/bin/xournalpp.exe', '%ProgramFiles%/Xournal++/xournalpp.exe']
    linux_command: "xournalpp"
    aliases: ["xournal", "xournal++", "journal", "xournalpp"]
  openboard:
    name: "OpenBoard"
    command: "OpenBoard.exe"
    windows_paths: ['%ProgramFiles%/OpenBoard/OpenBoard.exe', '%ProgramFiles(x86)%/OpenBoard/OpenBoard.exe']
    linux_command: "openboard"
    aliases: ["openboard", "open board", "the board", "board", "whiteboard"]

# Web App Shortcuts: maps friendly web service names to URLs opened in default browser.
web_apps:
  chatgpt:
    name: "ChatGPT"
    url: "https://chatgpt.com"
    aliases: ["chat gpt", "openai"]
  claude:
    name: "Claude"
    url: "https://claude.ai"
    aliases: ["anthropic", "claude ai"]
  deepseek:
    name: "DeepSeek"
    url: "https://chat.deepseek.com"
    aliases: ["deep seek"]
  gemini:
    name: "Gemini"
    url: "https://gemini.google.com"
    aliases: ["google gemini", "gemini ai"]
  perplexity:
    name: "Perplexity"
    url: "https://www.perplexity.ai"
    search_template: "https://www.perplexity.ai/search?q={query}"
    aliases: ["perplexity ai"]
  wikipedia:
    name: "Wikipedia"
    url: "https://en.wikipedia.org"
    search_template: "https://en.wikipedia.org/wiki/Special:Search?search={query}"
    aliases: ["wiki", "wikimedia", "wiki media", "wiki pedia"]
  arxiv:
    name: "arXiv"
    url: "https://arxiv.org"
    search_template: "https://arxiv.org/search/?query={query}&searchtype=all"
    aliases: ["ar xive", "papers"]
  github:
    name: "GitHub"
    url: "https://github.com"
    aliases: ["git hub"]
  youtube:
    name: "YouTube"
    url: "https://www.youtube.com"
    search_template: "https://www.youtube.com/results?search_query={query}"
    aliases: ["you tube"]
  google:
    name: "Google Search"
    url: "https://www.google.com"
    search_template: "https://www.google.com/search?q={query}"
    aliases: ["google search"]
